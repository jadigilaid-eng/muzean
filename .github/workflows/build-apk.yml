name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: bun install

      - name: Add Capacitor
        run: |
          bun add @capacitor/core @capacitor/android
          bun add -d @capacitor/cli
          cat > capacitor.config.ts <<'EOF'
          import type {CapacitorConfig} from '@capacitor/cli';
          const config: CapacitorConfig = {
            appId: 'com.muzean.app',
            appName: 'MUZEAN',
            webDir: 'dist',
            android: {backgroundColor: '#008080'},
          };
          export default config;
          EOF

      - name: Build web app
        run: bun run build

      - name: Create Android project
        run: |
          bunx cap add android
          bunx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MUZEAN.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MUZEAN-apk
          path: MUZEAN.apk

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: MUZEAN APK (latest)
          files: MUZEAN.apk
          make_latest: true
